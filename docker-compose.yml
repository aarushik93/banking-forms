services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: ${POSTGRES_DB:-bankforms}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d ${POSTGRES_DB:-bankforms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      LOG_JSON: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@db:5432/${POSTGRES_DB:-bankforms}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me}
      # Default: real IDMatrix adapter talking SOAP to the bundled mock service.
      # Swap IDMATRIX_URL/credentials to Equifax's when you have real access.
      KYC_PROVIDER: ${KYC_PROVIDER:-idmatrix}
      IDMATRIX_URL: ${IDMATRIX_URL:-http://idmatrix-mock:8700/sys2/idmatrix-v4}
      IDMATRIX_USERNAME: ${IDMATRIX_USERNAME:-idm-demo}
      IDMATRIX_PASSWORD: ${IDMATRIX_PASSWORD:-idm-demo-password}
      IDMATRIX_REASON_FOR_ENQUIRY: ${IDMATRIX_REASON_FOR_ENQUIRY:-Account opening}
      EXPERIAN_BASE_URL: ${EXPERIAN_BASE_URL:-https://sandbox-api.experian.com.au}
      EXPERIAN_CLIENT_ID: ${EXPERIAN_CLIENT_ID:-}
      EXPERIAN_CLIENT_SECRET: ${EXPERIAN_CLIENT_SECRET:-}
      EXPERIAN_USERNAME: ${EXPERIAN_USERNAME:-}
      EXPERIAN_PASSWORD: ${EXPERIAN_PASSWORD:-}
      BSB_DIRECTORY_URL: ${BSB_DIRECTORY_URL:-https://auspaynetbsbpublic.blob.core.windows.net/bsb-reports/BSBDirectoryFull.csv}
      BSB_STRICT: ${BSB_STRICT:-true}
      ADDRESS_PROVIDER: ${ADDRESS_PROVIDER:-nominatim}
      GEOSCAPE_API_KEY: ${GEOSCAPE_API_KEY:-}
      ACCOUNT_VERIFICATION_PROVIDER: ${ACCOUNT_VERIFICATION_PROVIDER:-mock}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-investments@example-bank.test}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Example Bank Investments}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
    depends_on:
      db:
        condition: service_healthy
      idmatrix-mock:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  idmatrix-mock:
    build: ./mock-services/idmatrix
    restart: unless-stopped
    environment:
      # ACCEPT keeps demos friction-free; REFER mimics a real bureau's
      # treatment of identities it holds no records for.
      MOCK_DEFAULT_OUTCOME: ${MOCK_DEFAULT_OUTCOME:-ACCEPT}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
